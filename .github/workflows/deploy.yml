name: Build and deploy

# Builds a Docker image on GitHub's runners, pushes it to GitHub Container
# Registry, then tells the VPS to pull and restart. The VPS never compiles
# anything — a 2GB droplet will happily serve this app but will struggle to
# build it, and a failed build on the server means downtime.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy from the Actions tab without a commit

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      # Set the GTM ID ONCE as a repository variable and every future build
      # picks it up automatically — pushing code never changes or clears it.
      #
      # A missing ID does NOT stop the deploy. The site is fully functional
      # without GTM: the container script renders nothing at all, so there are
      # no requests, no errors and no console noise.
      #
      # It still warrants a warning, because the failure mode is silent. The
      # value is compiled into the bundle, so a build without it produces a site
      # that looks completely correct and simply never fires a conversion — and
      # you find out from an empty Google Ads report weeks later. The annotation
      # below puts that on the run summary where someone will see it.
      - name: Check analytics configuration
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_GTM_ID }}" ]; then
            echo "::warning::NEXT_PUBLIC_GTM_ID is not set — deploying without Google Tag Manager."
            echo ""
            echo "The site will work normally but will have NO conversion tracking."
            echo ""
            echo "To enable it, set the variable once at:"
            echo "  Settings → Secrets and variables → Actions → Variables → New repository variable"
            echo "  Name: NEXT_PUBLIC_GTM_ID   Value: GTM-XXXXXXX"
            echo ""
            echo "Then re-run this workflow — the ID is baked in at build time,"
            echo "so setting the variable alone changes nothing until a rebuild."
          else
            echo "✓ GTM container: ${{ vars.NEXT_PUBLIC_GTM_ID }}"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what compose pulls; the SHA tag is what you roll back to.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are compiled into the bundle, so they must be build
          # args. Changing this value requires a rebuild, not a restart.
          build-args: |
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true # abort on the first failing command
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_SITE_PATH }}

            # The registry is private, so the server authenticates with a PAT
            # that has read:packages only.
            echo "${{ secrets.GHCR_PAT }}" \
              | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for the container to report healthy rather than assuming it.
            echo "Waiting for health..."
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' \
                $(docker compose ps -q web) 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "Healthy after ${i}0s"
                exit 0
              fi
              sleep 10
            done

            echo "Container did not become healthy — recent logs:"
            docker compose logs --tail=50 web
            exit 1

      - name: Prune old images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Untagged layers accumulate fast and fill a small VPS disk.
          script: docker image prune -af --filter "until=168h"
